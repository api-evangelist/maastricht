---
aid: maastricht
name: Maastricht University
description: >-
  Maastricht University (UM) is an international research university in Maastricht,
  Netherlands, known for its Problem-Based Learning model and ranked #230 in the QS
  World University Rankings 2025. UM does not operate a unified public developer
  portal; its confirmed machine-readable footprint consists of standards-based
  research-infrastructure interfaces rather than a productized API program. The
  Pure (Elsevier) current research information system at cris.maastrichtuniversity.nl
  exposes a live OAI-PMH endpoint serving OpenAIRE CERIF metadata, research data is
  published through the shared DataverseNL platform (a Dataverse instance with a
  public REST API), and the Maastricht University Institute of Data Science maintains
  an active open-source GitHub organization. Identity is federated via Shibboleth/SAML.
type: Index
position: Consumer
access: 3rd-Party
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/maastricht/refs/heads/main/apis.yml
