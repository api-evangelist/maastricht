- aid: maastricht:ids-github
  name: Maastricht University Institute of Data Science (Open Source)
  description: >-
    The Maastricht University Institute of Data Science (IDS) maintains an active public GitHub organization
    with open-source data-science tooling, including MOD-API conformance tooling, the Data Science Research
