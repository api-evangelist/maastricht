  name: Maastricht University Research Portal (Pure) OAI-PMH
  description: >-
    OAI-PMH metadata harvesting endpoint for the Maastricht University Pure (Elsevier) current research
    information system. Verified live, returning OpenAIRE CERIF 1.2 profile metadata for publications,
    datasets, and other research outputs. Standard OAI-PMH verbs (Identify, ListMetadataFormats, ListRecords,
    etc.) are supported.
  humanURL: https://cris.maastrichtuniversity.nl/
  baseURL: https://cris.maastrichtuniversity.nl/ws/oai
  tags:
