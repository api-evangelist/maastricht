specificationVersion: '0.19'
apis:
  - aid: maastricht:cris-oai-pmh
    name: Maastricht University Research Portal (Pure) OAI-PMH
    description: >-
      OAI-PMH metadata harvesting endpoint for the Maastricht University Pure
      (Elsevier) current research information system. Verified live, returning
      OpenAIRE CERIF 1.2 profile metadata for publications, datasets, and other
      research outputs. Standard OAI-PMH verbs (Identify, ListMetadataFormats,
      ListRecords, etc.) are supported.
    humanURL: https://cris.maastrichtuniversity.nl/
    baseURL: https://cris.maastrichtuniversity.nl/ws/oai
    tags: [ Research, OAI-PMH, Metadata, Pure, CERIF, Repository ]
    properties:
      - type: Documentation
        url: https://cris.maastrichtuniversity.nl/
      - type: x-OAI-PMH
        url: https://cris.maastrichtuniversity.nl/ws/oai?verb=Identify
  - aid: maastricht:dataversenl
    name: DataverseNL Research Data API (Maastricht collection)
    description: >-
      Maastricht University publishes and preserves research datasets through the
      shared DataverseNL platform, a Dataverse instance. Dataverse provides a public
      native/REST API for searching, retrieving, and managing dataverses, datasets,
      and files. The Maastricht University collection is hosted at the Maastricht
      sub-dataverse. The platform exposes a public info/version endpoint and standard
      Dataverse Search and Data Access APIs.
    humanURL: https://dataverse.nl/dataverse/maastricht
    baseURL: https://dataverse.nl/api
    tags: [ Research Data, Dataverse, Repository, Open Data, REST ]
    properties:
      - type: Documentation
        url: https://guides.dataverse.org/en/latest/api/
      - type: Website
        url: https://dataverse.nl/dataverse/maastricht
      - type: OpenAPI
        url: openapi/maastricht-dataversenl.yaml
      - type: x-json-schema
        url: json-schema/maastricht-dataverse-schema.json
      - type: x-json-schema
        url: json-schema/maastricht-dataset-schema.json
      - type: x-json-structure
        url: json-structure/maastricht-dataverse-structure.json
      - type: x-json-structure
        url: json-structure/maastricht-dataset-structure.json
      - type: x-example
        url: examples/maastricht-getDataverse-example.json
      - type: x-example
        url: examples/maastricht-search-example.json
      - type: x-example
        url: examples/maastricht-version-example.json
      - type: x-spectral-rules
        url: rules/maastricht-rules.yml
      - type: x-vocabulary
        url: vocabulary/maastricht-vocabulary.yml
      - type: x-json-ld
        url: json-ld/maastricht-context.jsonld
  - aid: maastricht:ids-github
    name: Maastricht University Institute of Data Science (Open Source)
    description: >-
      The Maastricht University Institute of Data Science (IDS) maintains an active
      public GitHub organization with open-source data-science tooling, including
      MOD-API conformance tooling, the Data Science Research Infrastructure (DSRI)
      documentation, semantic web / SPARQL endpoint libraries, and cohort metadata
      explorers. These are open-source projects rather than a hosted institutional
      API program.
    humanURL: https://github.com/MaastrichtU-IDS
    tags: [ Open Source, Data Science, Semantic Web, SPARQL, GitHub ]
    properties:
      - type: GitHub
        url: https://github.com/MaastrichtU-IDS
      - type: Documentation
        url: https://dsri.maastrichtuniversity.nl/
