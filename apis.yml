aid: maastricht
name: Maastricht University
description: >-
  Maastricht University (UM) is a public research university in Maastricht, Netherlands, founded in
  1976 and known internationally for its Problem-Based Learning model. Measured honestly, UM
  operates no API programme: there is no developer portal, no api.maastrichtuniversity.nl, no
  status page, no published versioning or deprecation policy, and no first-party OpenAPI anywhere
  on its estate. What it does operate is a small set of standards-based surfaces on its own domain
  — a live, keyless OAI-PMH 2.0 harvesting endpoint at cris.maastrichtuniversity.nl serving 798,420
  records across six metadata profiles including OpenAIRE CERIF 1.2 with resolvable ORCID iDs; a
  self-hosted GitLab whose REST API answers unauthenticated project queries; and its own ADFS
  identity provider publishing both OpenID Connect discovery and signed SAML 2.0 federation
  metadata, with its entity carried in SURFconext and thereby eduGAIN. Everything else that looks
  like a Maastricht API is a purchase: research data lives in a collection inside the shared
  national DataverseNL installation, the CRIS is Elsevier Pure, the LMS is Instructure Canvas, and
  library discovery is OCLC WorldCat. Those are recorded here as tenant relationships, not as
  Maastricht's engineering.
