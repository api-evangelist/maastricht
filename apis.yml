x-coverage:
  state: covered
  reason: covered
  detail: >-
    Maastricht University operates no API programme, and this profile now says so. What was
    catalogued here on 2026-06-03 was upstream Dataverse's contract: one DataverseNL OpenAPI split
    by refine-openapis into thirty-six per-tag specifications, each registered as a separate
    "Maastricht University <tag> API" entry carrying a fabricated baseURL of
    https://cris.maastrichtuniversity.nl/ws/oai — the Pure OAI-PMH endpoint, which is not a
    Dataverse REST API and does not serve those paths. Thirty-six times the apparent footprint, on
    a host that does not run the software, for a contract at least six other institutions in this
    catalog also ship. All thirty-six, their seventy-three collections, and every schema, structure,
    example, ruleset, vocabulary, JSON-LD context and agentic-access file derived from them were
    removed on 2026-08-30.

    What replaced them is smaller and real. Three institution-operated surfaces were verified live:
    a keyless OAI-PMH 2.0 endpoint (six verbs, six metadata profiles, 798,420 records, ORCID iDs in
    the CERIF person records), a self-hosted GitLab answering unauthenticated project queries, and
    the university's own ADFS identity provider publishing OpenID Connect discovery and signed SAML
    2.0 metadata that is carried into SURFconext and eduGAIN. Four purchases were re-labelled as
    tenant relationships rather than deleted: DataverseNL, Elsevier Pure, Instructure Canvas and
    OCLC WorldCat.

    Absences confirmed by probe, not assumed: no api., data., open., developer., developers.,
    sis., portal. or status. host resolves under maastrichtuniversity.nl; no course catalog,
    timetable or registrar API; no CKAN or Socrata open-data portal; no institution-operated library
    API. mdr.datahubmaastricht.nl returns HTTP 200 with an SPA shell on every path including
    /openapi.json, which is a soft-200, not an API. dataverse.nl serves an Anubis bot-challenge to
    scripted clients on every path — live, but unreadable without solving the challenge, and a
    vendor's surface regardless.
