openapi: 3.0.3
info:
  title: Dataverse Access addGlobusFilesToDataset API
  description: 'Open source research data repository software. — DataverseNL installation (v6.9) hosting the Maastricht University research data collection (alias: maastricht). Spec retrieved live from https://dataverse.nl/openapi and saved faithfully as OpenAPI 3.0.3.'
  version: '6.9'
servers:
- url: https://dataverse.nl/api
  description: DataverseNL production REST API (hosts the Maastricht University collection at /dataverse/maastricht)
tags:
- name: addGlobusFilesToDataset
  description: Uploads a Globus file for a dataset
paths:
  /datasets/{id}/addGlobusFiles:
    post:
      tags:
      - addGlobusFilesToDataset
      summary: Uploads a Globus file for a dataset
      description: Uploads a Globus file for a dataset
      operationId: Datasets_addGlobusFilesToDataset
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
      responses:
        '200':
          description: Globus file uploaded successfully to dataset
