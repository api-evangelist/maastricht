openapi: 3.0.3
info:
  title: Dataverse Access ExternalTools API
  description: 'Open source research data repository software. — DataverseNL installation (v6.9) hosting the Maastricht University research data collection (alias: maastricht). Spec retrieved live from https://dataverse.nl/openapi and saved faithfully as OpenAPI 3.0.3.'
  version: '6.9'
servers:
- url: https://dataverse.nl/api
  description: DataverseNL production REST API (hosts the Maastricht University collection at /dataverse/maastricht)
tags:
- name: ExternalTools
paths:
  /externalTools:
    get:
      operationId: ExternalToolsApi_getExternalTools
      responses:
        '200':
          description: OK
      tags:
      - ExternalTools
    post:
      operationId: ExternalToolsApi_addExternalTool
      responses:
        '200':
          description: OK
      tags:
      - ExternalTools
  /externalTools/{id}:
    get:
      operationId: ExternalToolsApi_getExternalTool
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          description: OK
      tags:
      - ExternalTools
    delete:
      operationId: ExternalToolsApi_deleteExternalTool
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          description: OK
      tags:
      - ExternalTools
