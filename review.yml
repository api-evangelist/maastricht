    summary: >-
      Maastricht University has no unified public developer portal or productized API
      program. The confirmed machine-readable footprint is standards-based research
      infrastructure. The Pure (Elsevier) CRIS OAI-PMH endpoint was verified live,
      returning valid OpenAIRE CERIF 1.2 XML for ListMetadataFormats; the bare /ws/
      web-services path returns 403 and the OAI Identify verb intermittently 500s but
      ListMetadataFormats succeeds, confirming a working OAI-PMH service. Research data
      is published via the shared DataverseNL platform whose API (info/version) returns
      200, though the Maastricht collection page sits behind an anti-bot challenge for
      automated clients. The Institute of Data Science GitHub org is real and active.
      No endpoints were fabricated; only live-confirmed or standards-derived URLs listed.
