vocabulary:
  name: Maastricht University DataverseNL API Vocabulary
  description: >-
    Controlled vocabulary of the key terms encountered in the DataverseNL research data
    REST API as used by the Maastricht University collection (alias: maastricht). Terms
    were derived from the live OpenAPI 3.0.3 description at https://dataverse.nl/openapi
    and live API responses.
  version: "1.0.0"
  terms:
    - term: Dataverse
      definition: >-
        A container (collection) within the DataverseNL repository that holds datasets
        and/or other dataverses. The Maastricht University dataverse has alias "maastricht".
      tags: [collection, container, core]
    - term: Dataset
      definition: >-
        A versioned, citable container of research data files plus metadata, identified by
        a persistent global identifier (DOI).
      tags: [core, research-data, citable]
    - term: DataFile
      definition: >-
        An individual file belonging to a dataset version, accessible through the Data Access API.
      tags: [file, data-access]
    - term: globalId
      definition: >-
        The persistent identifier for a dataset, expressed as a DOI (e.g. doi:10.34894/VNCVSL).
      tags: [identifier, doi, persistent]
    - term: versionState
      definition: >-
        Lifecycle state of a dataset version; observed values include RELEASED, DRAFT,
        DEACCESSIONED, and ARCHIVED.
      tags: [versioning, lifecycle]
    - term: dataverseType
      definition: >-
        Classification of a dataverse; the Maastricht collection is ORGANIZATIONS_INSTITUTIONS.
      tags: [classification, enum]
    - term: subtree
      definition: >-
        Search parameter scoping results to a dataverse and its descendants (e.g. subtree=maastricht).
      tags: [search, scope, query]
    - term: Search API
      definition: >-
        The /api/search endpoint returning datasets, dataverses, and files matching a query.
      tags: [search, endpoint]
    - term: Data Access API
      definition: >-
        The /api/access endpoints for downloading datafiles, bundles, and metadata.
      tags: [endpoint, download, data-access]
    - term: persistent identifier
      definition: >-
        A durable, resolvable identifier (DOI) minted for datasets to support citation and preservation.
      tags: [doi, citation, preservation]
    - term: metadata block
      definition: >-
        A grouped set of metadata fields (e.g. citation, geospatial) applied to datasets.
      tags: [metadata, schema]
    - term: storageIdentifier
      definition: >-
        Internal storage reference for a dataset or file (e.g. surf://10.34894/VNCVSL on SURF infrastructure).
      tags: [storage, infrastructure]
